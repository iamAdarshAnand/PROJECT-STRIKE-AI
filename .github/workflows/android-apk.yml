name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Godot 4.3 and matching export templates
        shell: bash
        run: |
          set -euo pipefail
          VERSION=4.3
          RELEASE="https://github.com/godotengine/godot/releases/download/${VERSION}-stable"
          curl -fL --retry 3 -o godot.zip "$RELEASE/Godot_v${VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo install -m 755 "Godot_v${VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -fL --retry 3 -o templates.tpz "$RELEASE/Godot_v${VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${VERSION}.stable"
          unzip -q templates.tpz -d /tmp/godot-export
          cp -a /tmp/godot-export/templates/. "$HOME/.local/share/godot/export_templates/${VERSION}.stable/"
          test -s "$HOME/.local/share/godot/export_templates/${VERSION}.stable/android_debug.apk"
          godot --version

      - name: Install Android build dependencies
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;23.2.8568313"
          test -s "$ANDROID_HOME/platforms/android-34/android.jar"
          test -x "$ANDROID_HOME/build-tools/34.0.0/aapt2"
          test -x "$ANDROID_HOME/platform-tools/adb"
          "$ANDROID_HOME/platform-tools/adb" start-server || true

      - name: Create debug signing keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure Godot Android export paths
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --editor --quit
          mkdir -p "$HOME/.config/godot"
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path.home() / ".config/godot/editor_settings-4.tres"
          content = p.read_text()
          values = {
              "export/android/android_sdk_path": os.environ["ANDROID_HOME"],
              "export/android/java_sdk_path": os.environ["JAVA_HOME"],
              "export/android/debug_keystore": str(Path.home() / ".android/debug.keystore"),
              "export/android/debug_keystore_user": "androiddebugkey",
              "export/android/debug_keystore_pass": "android",
          }
          for key, value in values.items():
              line = f'{key} = "{value}"'
              content, count = re.subn(r'(?m)^' + re.escape(key) + r'\s*=.*$', lambda _: line, content)
              if not count:
                  content += '\n' + line
          p.write_text(content)
          print("Godot Android editor configuration written:", p)
          PY
          grep 'export/android/' "$HOME/.config/godot/editor_settings-4.tres" | sed '/password/d;/_pass /d'

      - name: Export Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --path . --editor --quit
          godot --headless --verbose --path . --export-debug Android build/ProjectStrikeAI.apk
          test -s build/ProjectStrikeAI.apk
          ls -lh build/ProjectStrikeAI.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProjectStrikeAI-Android-APK
          path: build/ProjectStrikeAI.apk
          if-no-files-found: error
