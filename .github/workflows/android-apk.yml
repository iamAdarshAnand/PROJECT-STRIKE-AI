name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Godot and Android export templates
        shell: bash
        run: |
          set -euo pipefail
          VERSION=4.3
          wget -q "https://github.com/godotengine/godot/releases/download/${VERSION}-stable/Godot_v${VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${VERSION}-stable_linux.x86_64.zip"
          chmod +x "Godot_v${VERSION}-stable_linux.x86_64"
          sudo mv "Godot_v${VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          wget -q "https://github.com/godotengine/godot/releases/download/${VERSION}-stable/Godot_v${VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${VERSION}.stable"
          unzip -q "Godot_v${VERSION}-stable_export_templates.tpz" -d /tmp/godot-templates
          mv /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/${VERSION}.stable/"
      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      - name: Create Android debug signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Import project and export APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --path . --editor --quit
          cat > /tmp/configure_android.gd <<'GDSCRIPT'
          extends SceneTree
          func _initialize():
              var settings = EditorInterface.get_editor_settings()
              settings.set_setting("export/android/android_sdk_path", OS.get_environment("ANDROID_HOME"))
              settings.set_setting("export/android/java_sdk_path", OS.get_environment("JAVA_HOME"))
              var output = OS.get_environment("HOME").path_join(".config/godot/editor_settings-4.tres")
              var err = ResourceSaver.save(settings, output)
              if err != OK:
                  push_error("Could not persist Godot editor settings: %s" % err)
                  quit(1)
                  return
              print("Saved Android SDK paths to ", output)
              quit()
          GDSCRIPT
          godot --headless --path . --editor --script /tmp/configure_android.gd
          echo "Android SDK: $ANDROID_HOME"
          echo "Java SDK: $JAVA_HOME"
          ls -l "$HOME/.android/debug.keystore"
          test -f "$ANDROID_HOME/build-tools/34.0.0/aapt2"
          test -f "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"
          godot --headless --verbose --path . --export-debug "Android" build/ProjectStrikeAI.apk
          test -s build/ProjectStrikeAI.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ProjectStrikeAI-Android-APK
          path: build/ProjectStrikeAI.apk
          if-no-files-found: error
